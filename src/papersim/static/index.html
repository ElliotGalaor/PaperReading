<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperReading</title>
<!-- KaTeX : rendu des formules LaTeX des titres et résumés (texte brut si hors ligne). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a64;
    --border: #e2e0d8;
    --accent: #2f5d8a;
    --accent-soft: #e6eef6;
    --warn-bg: #fdf3dc;
    --warn-text: #7a5a10;
    --error-bg: #fbe7e5;
    --error-text: #8f2a20;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #201f1d;
      --text: #ecebe6;
      --muted: #a3a29b;
      --border: #34332f;
      --accent: #8db7e0;
      --accent-soft: #23303d;
      --warn-bg: #3a3019;
      --warn-text: #f0d48a;
      --error-bg: #3d2220;
      --error-text: #f4aaa2;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 860px; margin: 0 auto; padding: 40px 16px 64px; }
  header h1 { margin: 0; font-size: 1.8rem; letter-spacing: -0.01em; }
  header p { margin: 4px 0 28px; color: var(--muted); }

  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; min-height: 200px; padding: 24px; text-align: center;
    background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius);
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop:focus-visible { border-color: var(--accent); outline: none; }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop.busy { cursor: progress; opacity: .7; }
  .drop svg { width: 40px; height: 40px; color: var(--accent); }
  .drop strong { font-size: 1.05rem; }
  .drop .hint { color: var(--muted); font-size: .9rem; }
  .linklike { color: var(--accent); text-decoration: underline; }

  .options { display: flex; gap: 12px; align-items: center; margin: 14px 2px 0; color: var(--muted); font-size: .92rem; }
  select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; }

  .status { display: flex; align-items: center; gap: 10px; margin-top: 24px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .notice { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: .93rem; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-text); }
  .notice.error { background: var(--error-bg); color: var(--error-text); }
  .notice ul { margin: 0; padding-left: 18px; }

  .query { margin-top: 28px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .query .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .query h2 { margin: 4px 0 4px; font-size: 1.1rem; }
  .query p { margin: 6px 0 0; color: var(--muted); font-size: .93rem; }
  .analysis { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); display: grid; gap: 10px; }
  .analysis-row { display: grid; grid-template-columns: 6.5em minmax(0, 1fr); gap: 4px 10px; align-items: baseline; }
  @media (max-width: 520px) { .analysis-row { grid-template-columns: minmax(0, 1fr); } }
  .analysis-label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .analysis-label small { display: block; text-transform: none; letter-spacing: 0; font-size: .74rem; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tag { font-size: .84rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--text); }
  .tag.theme { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 600; }

  /* --- Barre de contrôle des résultats ------------------------------------- */
  h3.results-title { margin: 32px 0 12px; font-size: 1rem; }
  .controls {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 28px; align-items: end;
    padding: 14px 16px; margin-bottom: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  }
  @media (max-width: 640px) { .controls { grid-template-columns: minmax(0, 1fr); } }
  .control-label { display: flex; align-items: baseline; gap: 8px; font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
  .control-label output { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .btn-link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0 2px; cursor: pointer; text-decoration: underline; margin-left: auto; }

  /* Curseur à deux poignées : deux input[type=range] superposés sur une piste commune. */
  .range { position: relative; height: 28px; --thumb: 18px; }
  .range-track, .range-fill { position: absolute; top: 50%; height: 4px; border-radius: 2px; transform: translateY(-50%); }
  .range-track { left: calc(var(--thumb) / 2); right: calc(var(--thumb) / 2); background: var(--border); }
  .range-fill { background: var(--accent); }
  .range input {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
  }
  .range input::-webkit-slider-runnable-track { background: none; border: 0; }
  .range input::-moz-range-track { background: none; border: 0; }
  .range input::-webkit-slider-thumb {
    -webkit-appearance: none; pointer-events: auto; cursor: grab;
    width: var(--thumb); height: var(--thumb); border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent);
  }
  .range input::-moz-range-thumb {
    pointer-events: auto; cursor: grab;
    width: var(--thumb); height: var(--thumb); border-radius: 50%;
    background: var(--surface); border: 2px solid var(--accent); box-sizing: border-box;
  }
  .range input:focus-visible { outline: none; }
  .range input:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
  .range input:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px var(--accent-soft); }
  .range input:disabled::-webkit-slider-thumb { border-color: var(--border); cursor: default; }
  .range input:disabled::-moz-range-thumb { border-color: var(--border); cursor: default; }
  .range-ends { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Sélecteur d'affichage : boutons radio présentés en contrôle segmenté. */
  .segmented { position: relative; display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label { padding: 5px 12px; font-size: .86rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .segmented label:not(:first-of-type) { border-left: 1px solid var(--border); }
  .segmented input:checked + label { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .segmented input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (max-width: 420px) { .segmented { display: flex; } .segmented label { flex: 1; text-align: center; padding: 6px 4px; } }

  /* --- Résultats ----------------------------------------------------------- */
  ol.results { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .results.dim { opacity: .5; transition: opacity .15s; }
  .result { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); gap: 4px 10px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .results[data-view="compact"] .result { padding: 10px 16px; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 1px; }
  .result .title { color: var(--text); font-weight: 600; text-decoration: none; }
  .result a.title:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .author { color: inherit; text-decoration: none; }
  .author:hover { color: var(--accent); text-decoration: underline; }
  .author:focus-visible, .more-authors:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
  .more-authors { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .more-authors:hover { text-decoration: underline; }
  .signals { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  a.chip { text-decoration: none; }
  a.chip:hover { background: var(--accent); color: var(--surface); }
  a.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a.chip::after { content: " ↗"; font-size: .9em; }
  .abstract { margin: 10px 0 0; font-size: .92rem; line-height: 1.55; }
  .abstract.clamped { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .abstract.missing { color: var(--muted); font-style: italic; }
  .more { margin-top: 4px; font-size: .85rem; }
  .empty { color: var(--muted); margin-top: 16px; }
  .katex { font-size: 1.05em; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main>
  <header>
    <h1>PaperReading</h1>
    <p>Déposez un article pour trouver les papiers les plus proches du corpus.</p>
  </header>

  <div id="drop" class="drop" role="button" tabindex="0" aria-describedby="drop-hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-6"/><path d="m9.5 13.5 2.5-2.5 2.5 2.5"/>
    </svg>
    <strong>Glissez un fichier ici</strong>
    <span id="drop-hint" class="hint">ou <span class="linklike">choisissez-le</span> · PDF, .txt ou .md · 20 Mo max</span>
  </div>
  <input id="file" class="sr-only" type="file" accept=".pdf,.txt,.md,application/pdf,text/plain,text/markdown">

  <div class="options">
    <label for="k">Nombre de résultats</label>
    <select id="k"><option>5</option><option selected>10</option><option>20</option></select>
  </div>

  <div id="status" class="status" hidden><div class="spinner"></div><span id="status-text"></span></div>
  <div id="error" class="notice error" role="alert" hidden></div>
  <div id="warnings" class="notice warn" hidden><ul></ul></div>
  <section id="query" class="query" hidden aria-live="polite"></section>

  <section id="results-section" hidden>
    <h3 class="results-title" id="results-title" aria-live="polite"></h3>

    <div class="controls">
      <div id="year-filter" role="group" aria-labelledby="year-label">
        <div class="control-label">
          <span id="year-label">Années</span>
          <output id="year-output" for="year-min year-max">toutes</output>
          <button id="year-reset" class="btn-link" type="button" hidden>Toutes les années</button>
        </div>
        <div class="range">
          <div class="range-track"><div class="range-fill" id="range-fill"></div></div>
          <input id="year-min" type="range" aria-label="Année de début">
          <input id="year-max" type="range" aria-label="Année de fin">
        </div>
        <div class="range-ends"><span id="range-lo"></span><span id="range-hi"></span></div>
      </div>

      <div role="radiogroup" aria-labelledby="view-label">
        <div class="control-label"><span id="view-label">Affichage</span></div>
        <div class="segmented">
          <input type="radio" name="view" id="view-compact" value="compact">
          <label for="view-compact" title="Titre et auteurs">Small</label>
          <input type="radio" name="view" id="view-infos" value="infos" checked>
          <label for="view-infos" title="Titre, auteurs, année, revue et signaux">Medium</label>
          <input type="radio" name="view" id="view-abstract" value="abstract">
          <label for="view-abstract" title="Titre, informations et résumé">Large</label>
        </div>
      </div>
    </div>

    <ol id="results" class="results"></ol>
  </section>
</main>

<script src="/static/authors.js"></script>
<script src="/static/math.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), input = $("file");
  const yearMin = $("year-min"), yearMax = $("year-max");
  const SIGNALS = {
    semantic: ["Sémantique", "Proximité de sens entre les abstracts (SPECTER2)"],
    lexical: ["Mots", "Mots en commun dans le titre et l'abstract"],
    citations: ["Citations", "Références bibliographiques en commun"],
  };
  const VIEW_KEY = "paperreading.view";
  // Étiquettes qui ouvrent le classement complet du signal dans un nouvel onglet.
  const RANKABLE = new Set(["semantic", "lexical"]);

  let busy = false;
  let lastQuery = null;     // dernière recherche, pour la relancer sans renvoyer le fichier
  let lastResults = [];     // derniers résultats, pour changer d'affichage sans requête
  let lastPeriod = "";
  let lastYears = { min: null, max: null };  // période des résultats affichés
  let corpus = null;        // { min, max } années du corpus

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const c of children) if (c != null) node.append(c);
    return node;
  }

  function paperLink(p) {
    if (p.arxiv_id) return "https://arxiv.org/abs/" + p.arxiv_id;
    if (p.doi) return "https://doi.org/" + p.doi;
    return null;
  }

  function setBusy(on, text) {
    busy = on;
    drop.classList.toggle("busy", on);
    drop.setAttribute("aria-busy", on ? "true" : "false");
    $("status").hidden = !on;
    $("status-text").textContent = text || "";
  }

  function reset() {
    for (const id of ["error", "warnings", "query", "results-section"]) $(id).hidden = true;
  }

  function showError(message) {
    $("error").textContent = message;
    $("error").hidden = false;
  }

  function showWarnings(list) {
    const ul = $("warnings").querySelector("ul");
    ul.replaceChildren(...list.map((w) => el("li", { textContent: w })));
    $("warnings").hidden = list.length === 0;
  }

  function showQuery(data, fileName) {
    const box = $("query");
    if (data.mode === "paper") {
      const p = data.paper, url = paperLink(p);
      const title = url ? el("a", { href: url, target: "_blank", rel: "noopener", textContent: p.title, className: "linklike" }) : p.title;
      box.replaceChildren(
        el("div", { className: "label", textContent: "Papier reconnu" }),
        el("h2", {}, title),
        PaperAuthors.metaNode(p),
      );
    } else {
      const ex = data.extracted || {};
      const abstract = ex.abstract ? ex.abstract.slice(0, 320) + (ex.abstract.length > 320 ? "…" : "") : "Abstract non détecté : recherche sur le début du texte.";
      box.replaceChildren(
        el("div", { className: "label", textContent: "Recherche à partir du texte extrait" }),
        el("h2", { textContent: ex.title || fileName }),
        el("p", { textContent: abstract }),
      );
    }
    const analysis = renderAnalysis(data.analysis);
    if (analysis) box.append(analysis);
    box.hidden = false;
    PaperMath.render(box);
  }

  // Thèmes (catégories) et mots-clés identifiés dans le papier déposé.
  function renderAnalysis(a) {
    if (!a || (!(a.themes || []).length && !(a.keywords || []).length)) return null;
    const rows = [];
    if ((a.themes || []).length) {
      const label = el("span", { className: "analysis-label", textContent: "Thèmes" });
      if (a.themes_source === "similar") label.append(el("small", { textContent: "d'après les papiers similaires" }));
      rows.push(el("div", { className: "analysis-row" }, label,
        el("ul", { className: "tags", ariaLabel: "Thèmes" },
          ...a.themes.map((t) => el("li", { className: "tag theme", textContent: t.name, title: t.code })))));
    }
    if ((a.keywords || []).length) {
      rows.push(el("div", { className: "analysis-row" },
        el("span", { className: "analysis-label", textContent: "Mots-clés" }),
        el("ul", { className: "tags", ariaLabel: "Mots-clés" },
          ...a.keywords.map((k) => el("li", { className: "tag", textContent: k })))));
    }
    return el("div", { className: "analysis" }, ...rows);
  }

  // --- Curseur d'années -----------------------------------------------------------

  function setCorpusBounds(c) {
    const hadFullRange = !corpus || (Number(yearMin.value) === corpus.min && Number(yearMax.value) === corpus.max);
    corpus = c;
    $("year-filter").hidden = !c;
    if (!c) return;
    for (const r of [yearMin, yearMax]) { r.min = c.min; r.max = c.max; r.step = 1; r.disabled = c.min === c.max; }
    if (hadFullRange) {
      yearMin.value = c.min;
      yearMax.value = c.max;
    }
    $("range-lo").textContent = c.min;
    $("range-hi").textContent = c.max;
    updateSlider();
  }

  async function loadCorpusYears() {
    try {
      const resp = await fetch("/corpus/years");
      if (!resp.ok) return;
      const c = await resp.json();
      setCorpusBounds(c.min == null ? null : { min: c.min, max: c.max });
    } catch { /* le filtre est facultatif */ }
  }

  // Bornes choisies ; null quand une poignée est en butée (pas de filtre de ce côté).
  function readYears() {
    if (!corpus) return { min: null, max: null };
    const lo = Number(yearMin.value), hi = Number(yearMax.value);
    return { min: lo > corpus.min ? lo : null, max: hi < corpus.max ? hi : null };
  }

  function periodLabel({ min, max }) {
    if (min !== null && max !== null) return min === max ? `en ${min}` : `de ${min} à ${max}`;
    if (min !== null) return `depuis ${min}`;
    if (max !== null) return `jusqu'à ${max}`;
    return "";
  }

  function updateSlider(moved) {
    if (!corpus) return;
    let lo = Number(yearMin.value), hi = Number(yearMax.value);
    if (lo > hi) {  // les poignées ne se croisent pas
      if (moved === yearMin) { yearMin.value = hi; lo = hi; } else { yearMax.value = lo; hi = lo; }
    }
    const span = corpus.max - corpus.min || 1;
    const fill = $("range-fill");
    // La piste est réduite d'une demi-poignée de chaque côté (9 px) pour suivre le centre des poignées.
    fill.style.left = `calc(9px + (100% - 18px) * ${(lo - corpus.min) / span})`;
    fill.style.width = `calc((100% - 18px) * ${(hi - lo) / span})`;
    // Poignées confondues en butée haute : la poignée « début » doit rester attrapable.
    yearMin.style.zIndex = lo >= corpus.max ? 3 : 1;
    yearMin.setAttribute("aria-valuetext", String(lo));
    yearMax.setAttribute("aria-valuetext", String(hi));
    const years = readYears();
    $("year-output").textContent = years.min === null && years.max === null ? "toutes" : `${lo} – ${hi}`;
    $("year-reset").hidden = years.min === null && years.max === null;
  }

  // --- Requêtes --------------------------------------------------------------------

  async function postJSON(url, options) {
    const resp = await fetch(url, options);
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      let detail = typeof data.detail === "string" ? data.detail : `Erreur ${resp.status}`;
      if (resp.status >= 500 && typeof data.detail !== "string") {
        detail = `Erreur du serveur (${resp.status}). La base PostgreSQL est-elle lancée (docker compose up -d) ? Détails dans le terminal de « papersim serve ».`;
      }
      throw new Error(detail);
    }
    return data;
  }

  function networkMessage(err) {
    return err.message === "Failed to fetch" ? "Le serveur ne répond pas. Est-il lancé (papersim serve) ?" : err.message;
  }

  let pending = false;
  async function refilter() {
    if (!lastQuery) return;
    if (busy) { pending = true; return; }  // relancée dès la fin de la requête en cours
    const years = readYears();
    const k = Number($("k").value);
    let request;
    if (lastQuery.mode === "paper") {
      const params = new URLSearchParams({ k });
      if (years.min !== null) params.set("year_min", years.min);
      if (years.max !== null) params.set("year_max", years.max);
      request = postJSON(`/papers/${encodeURI(lastQuery.paperId)}/similar?${params}`);
    } else {
      request = postJSON("/search/text", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: lastQuery.query, k, year_min: years.min, year_max: years.max }),
      });
    }
    busy = true;
    $("error").hidden = true;
    $("results").classList.add("dim");
    try {
      const data = await request;
      showResults(data.results || [], years);
    } catch (err) {
      showError(networkMessage(err));
    } finally {
      busy = false;
      $("results").classList.remove("dim");
      if (pending) { pending = false; refilter(); }
    }
  }

  let filterTimer;
  function scheduleRefilter() {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(refilter, 350);
  }

  // --- Affichage des résultats --------------------------------------------------------

  function currentView() {
    return document.querySelector('input[name="view"]:checked').value;
  }

  function renderAbstract(p) {
    if (!p.abstract) return el("p", { className: "abstract missing", textContent: "Résumé indisponible." });
    const text = el("p", { className: "abstract", textContent: p.abstract });
    if (p.abstract.length < 360) return text;
    text.classList.add("clamped");
    const toggle = el("button", { type: "button", className: "btn-link more", textContent: "Lire la suite" });
    toggle.setAttribute("aria-expanded", "false");
    toggle.addEventListener("click", () => {
      const open = text.classList.toggle("clamped") === false;
      toggle.textContent = open ? "Réduire" : "Lire la suite";
      toggle.setAttribute("aria-expanded", String(open));
    });
    return el("div", {}, text, toggle);
  }

  function renderResults() {
    const list = $("results"), view = currentView();
    list.dataset.view = view;
    if (!lastResults.length) {
      const message = lastPeriod
        ? `Aucun papier similaire publié ${lastPeriod}. Élargissez la période.`
        : "Aucun papier similaire dans le corpus. Importez d'abord des papiers (papersim ingest-arxiv …).";
      list.replaceChildren(el("p", { className: "empty", textContent: message }));
      return;
    }
    list.replaceChildren(...lastResults.map((r, i) => {
      const p = r.paper, url = paperLink(p);
      const title = url
        ? el("a", { className: "title", href: url, target: "_blank", rel: "noopener", textContent: p.title })
        : el("span", { className: "title", textContent: p.title });
      const body = el("div", {}, title);
      if (view === "compact") {
        body.append(PaperAuthors.metaNode(p, false));
      } else {
        body.append(PaperAuthors.metaNode(p));
        const chips = Object.entries(r.signals || {}).map(([name, s]) => {
          const [label, help] = SIGNALS[name] || [name, ""];
          const text = `${label} #${s.rank}`;
          if (RANKABLE.has(name) && lastQuery) {
            return el("a", {
              className: "chip", href: rankingUrl(name, p.id), target: "_blank", rel: "noopener",
              title: `${help} — voir les 15 premiers de ce classement`, textContent: text,
            });
          }
          return el("span", { className: "chip", title: help, textContent: text });
        });
        body.append(el("div", { className: "signals" }, ...chips));
        if (view === "abstract") body.append(renderAbstract(p));
      }
      return el("li", { className: "result" }, el("span", { className: "rank", textContent: i + 1 }), body);
    }));
    PaperMath.render(list);
  }

  // Lien vers la page /ranking ; les paramètres sont dans le fragment (#), qui ne part pas au serveur.
  function rankingUrl(signal, highlightId) {
    const params = new URLSearchParams({ signal, hl: highlightId });
    if (lastQuery.mode === "paper") params.set("paper", lastQuery.paperId);
    else {
      params.set("q", lastQuery.query);
      if (lastQuery.title) params.set("title", lastQuery.title);
    }
    if (lastYears.min !== null) params.set("from", lastYears.min);
    if (lastYears.max !== null) params.set("to", lastYears.max);
    return `/ranking#${params}`;
  }

  function showResults(results, years = readYears()) {
    lastResults = results;
    lastYears = years;
    lastPeriod = periodLabel(years);
    $("results-title").textContent = results.length
      ? `${results.length} papiers similaires${lastPeriod ? " · " + lastPeriod : ""}`
      : "Aucun résultat";
    $("results-section").hidden = false;
    renderResults();
  }

  // --- Dépôt de fichier ------------------------------------------------------------------

  // Ouverte hors du serveur (file://, aperçu data:…), la page ne peut pas joindre l'API.
  const OPENED_AS_FILE = !/^https?:$/.test(location.protocol);
  const FILE_MODE_MESSAGE =
    "Cette page est ouverte comme fichier, pas depuis le serveur : elle ne peut pas lancer de recherche. " +
    "Lancez « papersim serve » dans un terminal, puis ouvrez http://127.0.0.1:8000.";

  async function search(file) {
    if (busy || !file) return;
    reset();
    if (OPENED_AS_FILE) return showError(FILE_MODE_MESSAGE);
    if (file.size > 20 * 1024 * 1024) return showError("Fichier trop volumineux (20 Mo au plus).");
    const years = readYears();
    setBusy(true, `Analyse de « ${file.name} »…`);
    const body = new FormData();
    body.append("file", file);
    body.append("k", $("k").value);
    if (years.min !== null) body.append("year_min", years.min);
    if (years.max !== null) body.append("year_max", years.max);
    lastQuery = null;
    try {
      const data = await postJSON("/search/file", { method: "POST", body });
      lastQuery = data.mode === "paper"
        ? { mode: "paper", paperId: data.paper.id }
        : { mode: "text", query: data.query, title: data.extracted && data.extracted.title };
      showWarnings(data.warnings || []);
      showQuery(data, file.name);
      showResults(data.results || [], years);
      loadCorpusYears();  // un papier reconnu a pu élargir la plage d'années
    } catch (err) {
      showError(networkMessage(err));
    } finally {
      setBusy(false);
      input.value = "";
    }
  }

  // --- Initialisation ----------------------------------------------------------------------

  try {
    const saved = localStorage.getItem(VIEW_KEY);
    const radio = saved && document.querySelector(`input[name="view"][value="${CSS.escape(saved)}"]`);
    if (radio) radio.checked = true;
  } catch { /* stockage indisponible : affichage par défaut */ }

  $("year-filter").hidden = true;
  if (OPENED_AS_FILE) showError(FILE_MODE_MESSAGE);
  else loadCorpusYears();

  for (const r of [yearMin, yearMax]) {
    r.addEventListener("input", () => { updateSlider(r); scheduleRefilter(); });
  }
  $("year-reset").addEventListener("click", () => {
    if (!corpus) return;
    yearMin.value = corpus.min;
    yearMax.value = corpus.max;
    updateSlider();
    refilter();
  });
  for (const radio of document.querySelectorAll('input[name="view"]')) {
    radio.addEventListener("change", () => {
      try { localStorage.setItem(VIEW_KEY, radio.value); } catch { /* ignoré */ }
      renderResults();
    });
  }
  $("k").addEventListener("change", refilter);

  drop.addEventListener("click", () => !busy && input.click());
  drop.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (!busy) input.click(); }
  });
  input.addEventListener("change", () => search(input.files[0]));

  // Empêche le navigateur d'ouvrir un fichier lâché à côté de la zone.
  for (const type of ["dragover", "drop"]) window.addEventListener(type, (e) => e.preventDefault());
  let depth = 0;
  drop.addEventListener("dragenter", () => { depth++; drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; drop.classList.remove("over"); } });
  drop.addEventListener("drop", (e) => {
    depth = 0;
    drop.classList.remove("over");
    search(e.dataTransfer.files[0]);  // un seul fichier à la fois : le premier
  });
})();
</script>
</body>
</html>
