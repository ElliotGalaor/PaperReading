<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classement · PaperReading</title>
<!-- KaTeX : rendu des formules LaTeX des titres et résumés (texte brut si hors ligne). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --text: #1d1d1b;
    --muted: #6b6a64;
    --border: #e2e0d8;
    --accent: #2f5d8a;
    --accent-soft: #e6eef6;
    --error-bg: #fbe7e5;
    --error-text: #8f2a20;
    --star: #b7860b;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --surface: #201f1d;
      --text: #ecebe6;
      --muted: #a3a29b;
      --border: #34332f;
      --accent: #8db7e0;
      --accent-soft: #23303d;
      --error-bg: #3d2220;
      --error-text: #f4aaa2;
      --star: #f2c14e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
  .user-bar { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; justify-content: flex-end; font-size: .88rem; }
  .user-name { font-weight: 600; }
  .user-name::before { content: "● "; color: var(--accent); font-size: .7em; vertical-align: 2px; }
  .user-link { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: none; }
  .user-link:hover { text-decoration: underline; }
  .user-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
  .back { color: var(--accent); font-size: .9rem; text-decoration: none; }
  .back:hover { text-decoration: underline; }
  h1 { margin: 10px 0 4px; font-size: 1.6rem; letter-spacing: -0.01em; }
  .lead { margin: 0; color: var(--muted); }

  .query { margin-top: 20px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .query .label { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .query .q-title { margin: 2px 0 0; font-weight: 600; }
  .query .q-meta { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .note { margin: 14px 2px 0; color: var(--muted); font-size: .88rem; }

  .status { display: flex; align-items: center; gap: 10px; margin-top: 24px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { margin-top: 20px; padding: 12px 14px; border-radius: 10px; background: var(--error-bg); color: var(--error-text); font-size: .93rem; }

  ol.ranking { list-style: none; margin: 22px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid; grid-template-columns: 2.2em minmax(0, 1fr) 7.5em auto; gap: 2px 12px; align-items: start;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  }
  .item.highlight { border: 2px solid var(--accent); padding: 11px 15px; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  .title { color: var(--text); font-weight: 600; text-decoration: none; }
  a.title:hover { color: var(--accent); text-decoration: underline; }
  .meta { color: var(--muted); font-size: .86rem; margin-top: 2px; }
  .query .meta { font-size: .9rem; }
  .author { color: inherit; text-decoration: none; }
  .author:hover { color: var(--accent); text-decoration: underline; }
  .author:focus-visible, .more-authors:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 2px; }
  .more-authors { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .more-authors:hover { color: var(--accent); text-decoration: underline; }
  .badge { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: .74rem; font-weight: 600; vertical-align: 2px; background: var(--accent-soft); color: var(--accent); }
  .score { text-align: right; font-variant-numeric: tabular-nums; font-size: .9rem; }
  .bar { height: 4px; margin-top: 6px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .empty { margin-top: 20px; color: var(--muted); }
  .katex { font-size: 1.05em; }
  .fav {
    width: 2rem; height: 2rem; margin: -5px -8px 0 0; padding: 0; border: 0; border-radius: 8px;
    background: none; color: var(--muted); font-size: 1.3rem; line-height: 1; cursor: pointer;
  }
  .fav:hover { background: var(--accent-soft); color: var(--star); }
  .fav[aria-pressed="true"] { color: var(--star); }
  .fav:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .fav:disabled { opacity: .5; cursor: progress; }
  .query-head { display: flex; align-items: flex-start; gap: 10px; }
  .query-head > div { flex: 1; min-width: 0; }
  @media (max-width: 520px) {
    .item { grid-template-columns: 2em minmax(0, 1fr) auto; }
    .item .fav { grid-column: 3; grid-row: 1; }
    .score { grid-column: 2; text-align: left; display: flex; align-items: center; gap: 10px; }
    .bar { flex: 1; margin-top: 0; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <a class="back" href="/">← Retour à PaperReading</a>
    <nav id="user-bar" class="user-bar" aria-label="Compte"></nav>
  </div>
  <h1 id="heading">Classement</h1>
  <p class="lead" id="lead"></p>

  <section class="query" id="query" hidden></section>
  <p class="note" id="note" hidden></p>

  <div class="status" id="status"><div class="spinner"></div><span>Calcul du classement…</span></div>
  <div class="error" id="error" role="alert" hidden></div>
  <ol class="ranking" id="ranking" aria-live="polite"></ol>
</main>

<script src="/static/authors.js"></script>
<script src="/static/math.js"></script>
<script src="/static/session.js"></script>
<script src="/static/favorites.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SIGNALS = {
    semantic: {
      title: "Classement « Sémantique »",
      lead: "Papiers dont le sens est le plus proche, d'après les embeddings SPECTER2 du titre et de l'abstract.",
      score: "cosinus",
      format: (s) => s.toFixed(3),
    },
    lexical: {
      title: "Classement « Mots »",
      lead: "Papiers qui partagent le plus de mots avec le titre et l'abstract (recherche plein texte PostgreSQL).",
      score: "score ts_rank",
      format: (s) => s.toFixed(4),
    },
    citations: {
      title: "Classement « Citations »",
      lead: "Papiers qui citent le plus de références en commun (couplage bibliographique).",
      score: "couplage",
      format: (s) => s.toFixed(3),
    },
  };

  // Paramètres dans le fragment (#…) : le texte de la requête peut être long et ne part pas au serveur.
  const params = new URLSearchParams(location.hash.slice(1));
  const signal = params.get("signal");
  const paperId = params.get("paper");
  const query = params.get("q");
  const title = params.get("title");
  const highlight = params.get("hl");
  const yearMin = params.get("from") ? Number(params.get("from")) : null;
  const yearMax = params.get("to") ? Number(params.get("to")) : null;
  const K = 15;

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    Object.assign(node, props);
    for (const c of children) if (c != null) node.append(c);
    return node;
  }
  const paperLink = (p) => (p.arxiv_id ? "https://arxiv.org/abs/" + p.arxiv_id : p.doi ? "https://doi.org/" + p.doi : null);
  function periodLabel() {
    if (yearMin !== null && yearMax !== null) return yearMin === yearMax ? `en ${yearMin}` : `de ${yearMin} à ${yearMax}`;
    if (yearMin !== null) return `depuis ${yearMin}`;
    if (yearMax !== null) return `jusqu'à ${yearMax}`;
    return "";
  }
  function fail(message) {
    $("status").hidden = true;
    $("error").textContent = message;
    $("error").hidden = false;
  }

  function showQuery(paper) {
    const box = $("query");
    if (paper) {
      const url = paperLink(paper);
      box.replaceChildren(el("div", { className: "query-head" },
        el("div", {},
          el("div", { className: "label", textContent: "Papier de départ" }),
          url ? el("a", { className: "q-title title", href: url, target: "_blank", rel: "noopener", textContent: paper.title })
              : el("p", { className: "q-title", textContent: paper.title }),
          PaperAuthors.metaNode(paper),
        ),
        PaperFavorites.button(paper),
      ));
    } else {
      box.replaceChildren(
        el("div", { className: "label", textContent: "Texte extrait du fichier" }),
        el("p", { className: "q-title", textContent: title || (query.slice(0, 140) + (query.length > 140 ? "…" : "")) }),
      );
    }
    box.hidden = false;
    PaperMath.render(box);
  }

  function showRanking(results, info) {
    $("status").hidden = true;
    const period = periodLabel();
    const note = [`${results.length} premiers papiers de ce seul classement`, period ? `publiés ${period}` : ""]
      .filter(Boolean).join(", ");
    $("note").textContent = `${note}. La liste principale fusionne ce classement avec les autres signaux.`;
    $("note").hidden = false;
    if (!results.length) {
      $("ranking").replaceChildren(el("p", { className: "empty", textContent: "Aucun papier dans ce classement." }));
      return;
    }
    // Barres relatives à l'écart entre le premier et le dernier de la liste : les cosinus sont
    // souvent très serrés (0,91 à 0,95), une échelle absolue donnerait des barres toutes pleines.
    const top = Math.max(...results.map((r) => r.score));
    const low = Math.min(...results.map((r) => r.score));
    const spread = top - low;
    let highlighted = null;
    $("ranking").replaceChildren(...results.map((r) => {
      const p = r.paper, url = paperLink(p);
      const titleNode = url
        ? el("a", { className: "title", href: url, target: "_blank", rel: "noopener", textContent: p.title })
        : el("span", { className: "title", textContent: p.title });
      const head = el("div", {}, titleNode);
      const isHl = highlight && p.id === highlight;
      if (isHl) head.append(el("span", { className: "badge", textContent: "papier cliqué" }));
      const bar = el("div", { className: "bar" }, el("span", {}));
      bar.firstChild.style.width = `${spread > 0 ? 8 + ((r.score - low) / spread) * 92 : 100}%`;
      const item = el("li", { className: "item" + (isHl ? " highlight" : "") },
        el("span", { className: "rank", textContent: r.rank }),
        el("div", {}, head, PaperAuthors.metaNode(p)),
        el("div", { className: "score", title: `${info.score} (barre : position entre le premier et le dernier de la liste)` },el("span", { textContent: info.format(r.score) }), bar),
        PaperFavorites.button(p),
      );
      if (isHl) highlighted = item;
      return item;
    }));
    PaperMath.render($("ranking"));
    if (highlight && !highlighted) {
      $("note").textContent += " Le papier cliqué n'est pas dans ces 15 premiers.";
    }
    if (highlighted) highlighted.scrollIntoView({ block: "center" });
  }

  async function load() {
    const info = SIGNALS[signal];
    if (!info || (!paperId && !query)) {
      return fail("Lien incomplet : ouvrez cette page depuis une étiquette « Mots » ou « Sémantique » des résultats.");
    }
    document.title = `${info.title} · PaperReading`;
    $("heading").textContent = info.title;
    $("lead").textContent = info.lead;
    if (!/^https?:$/.test(location.protocol)) {
      return fail("Cette page doit être ouverte depuis le serveur (papersim serve), pas comme fichier.");
    }
    let url, options;
    if (paperId) {
      const qs = new URLSearchParams({ k: K });
      if (yearMin !== null) qs.set("year_min", yearMin);
      if (yearMax !== null) qs.set("year_max", yearMax);
      url = `/papers/${encodeURI(paperId)}/ranking/${signal}?${qs}`;
    } else {
      url = "/search/text/ranking";
      options = {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, signal, k: K, year_min: yearMin, year_max: yearMax }),
      };
    }
    try {
      const resp = await fetch(url, options);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        throw new Error(typeof data.detail === "string" ? data.detail : `Erreur du serveur (${resp.status}).`);
      }
      showQuery(data.query && data.query.paper);
      showRanking(data.results || [], info);
    } catch (err) {
      fail(err.message === "Failed to fetch" ? "Le serveur ne répond pas. Est-il lancé (papersim serve) ?" : err.message);
    }
  }

  window.addEventListener("paperfavorites:error", (e) => {
    $("error").textContent = e.detail;
    $("error").hidden = false;
  });
  PaperSession.ready.then(() => { if (PaperSession.user()) PaperFavorites.load(); });
  load();
})();
</script>
</body>
</html>
