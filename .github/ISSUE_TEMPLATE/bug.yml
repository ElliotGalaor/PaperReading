name: Bug
description: Quelque chose ne fonctionne pas comme prévu
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Ce qui se passe
      description: Le comportement observé, avec le message d'erreur éventuel.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui était attendu
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. papersim serve
        2. Ouvrir http://127.0.0.1:8000
        3. …
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "Windows 11, Python 3.14, navigateur Chrome 140"
