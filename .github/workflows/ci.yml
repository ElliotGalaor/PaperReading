name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check src tests --output-format github

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Sans l'extra « embeddings » : torch n'est pas nécessaire aux tests.
      - run: pip install -e ".[dev]"
      - run: pytest -q

  integration:
    name: Intégration (PostgreSQL + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: papersim
          POSTGRES_PASSWORD: papersim
          POSTGRES_DB: papersim_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U papersim -d papersim_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PAPERSIM_TEST_DATABASE_URL: postgresql://papersim:papersim@localhost:5432/papersim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q -m integration -rs
