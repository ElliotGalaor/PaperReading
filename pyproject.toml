[project]
name = "papersim"
version = "0.1.0"
description = "Recherche de papiers scientifiques similaires (sujet, problème, méthode)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "feedparser>=6.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "numpy>=1.26",
    "pypdf>=4.0",
    "fonttools>=4.40",  # décodage des polices LaTeX (symboles mathématiques) par pypdf
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Séparé car lourd (torch) : inutile pour lancer les tests.
embeddings = ["torch>=2.2", "adapters>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
papersim = "papersim.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papersim"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
