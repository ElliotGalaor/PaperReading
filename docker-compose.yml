services:
  db:
    image: pgvector/pgvector:pg16
    # Redémarre avec Docker Desktop (après extinction du PC), sauf arrêt manuel.
    restart: unless-stopped
    environment:
      POSTGRES_USER: papersim
      POSTGRES_PASSWORD: papersim
      POSTGRES_DB: papersim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
